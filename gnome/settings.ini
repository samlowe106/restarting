[org/gnome/desktop/interface]
color-scheme='prefer-dark'
cursor-theme='Adwaita'
gtk-theme='adw-gtk3-dark'
icon-theme='Cosmic'
show-battery-percentage=true

[org/gnome/desktop/wm/preferences]
button-layout=':minimize,maximize,close'

# Edge tiling: drag a window to the top to maximize it, or to a side edge to
# tile it to that half of the screen. Off by default.
[org/gnome/mutter]
edge-tiling=true

# GNOME's touchpad default is clickfinger (right-click = any two-finger
# click, ignoring where you click); areas maps right-click to a corner of
# the pad instead - bottom-right, per libinput's own convention
[org/gnome/desktop/peripherals/touchpad]
click-method='areas'

[org/gnome/desktop/background]
color-shading-type='solid'
picture-options='zoom'
picture-uri='file:///home/sam/.local/share/backgrounds/2026-05-21-21-36-46-Matterhorn At Night.jpg'
picture-uri-dark='file:///home/sam/.local/share/backgrounds/2026-05-21-21-36-46-Matterhorn At Night.jpg'
primary-color='#000000000000'
secondary-color='#000000000000'

[org/gnome/shell]
favorite-apps=['org.gnome.Nautilus.desktop', 'kitty.desktop', 'firefox.desktop', 'com.discordapp.Discord.desktop', 'signal-desktop.desktop', 'com.spotify.Client.desktop', 'code.desktop', 'steam.desktop', 'thunderbird.desktop', 'appimagekit-joplin.desktop', 'org.gnome.World.PikaBackup.desktop', 'org.gnome.Settings.desktop']

[org/gnome/shell/extensions/dash-to-dock]
always-center-icons=false
background-opacity=0.40000000000000002
custom-theme-shrink=false
dash-max-icon-size=48
disable-overview-on-startup=true
dock-fixed=true
dock-position='BOTTOM'
extend-height=false
height-fraction=0.90000000000000002
preferred-monitor=-2
preferred-monitor-by-connector='eDP-1'
transparency-mode='FIXED'

[org/gnome/shell/extensions/pop-shell]
active-hint=false

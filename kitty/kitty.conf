# Font. kitty bundles no fonts, so this needs installing to
# ~/.local/share/fonts; restart.sh does that. "Medium" as the regular weight
# (not just for bold text) makes all text a bit thicker/heavier - useful
# against a variable-brightness background image. bold_font auto still
# correctly steps up further to SemiBold for actual bold text, so bold still
# reads bolder than regular.
font_family      JetBrains Mono Medium
bold_font        auto
italic_font      auto
bold_italic_font auto
font_size        12.0

# Maps the Nerd Font's private-use glyph ranges to the dedicated symbols
# font, so icons render without needing a full Nerd Font patch of the main
# typeface.
symbol_map U+E000-U+F8FF,U+F0000-U+FFFFD Symbols Nerd Font Mono

# Window
window_padding_width    8
scrollback_lines        20000
enable_audio_bell       no
confirm_os_window_close 0
# Defaults to yes, which means initial_window_width/height below only ever
# apply on a fresh install - after that kitty just reuses whatever size the
# last window happened to close at. Disabling it so "default size" actually
# means something fixed.
remember_window_size    no
initial_window_width    120c
initial_window_height   35c

# Tabs. Powerline separators need a Nerd Font, which restart.sh installs.
tab_bar_edge                top
tab_bar_style                powerline
tab_powerline_style          round
tab_bar_min_tabs             1
tab_bar_show_new_tab_button  yes

# Background image. Pokemon-Terminal sets the live image over remote control;
# pokemon_bg.jpg is kept in sync with the last choice by the `pokemon` shell
# function (see .bashrc) so a fresh kitty window starts with it too, instead
# of blank. These options control how it's drawn once set.
background_image        /home/sam/.config/kitty/pokemon_bg.jpg
background_image_layout scaled
background_image_linear yes
# 0.65 was crushing bright images (e.g. Rotom's orange) to a near-black,
# muddy box. 0.45 keeps them recognizable, at some cost to text contrast -
# for a genuinely bright pick, `pokemon -d` biases toward pre-filtered darker
# artwork instead of fighting a bright one with tint.
background_tint         0.45
# Was 0: that applies ZERO of the tint above to the padding/gap area around
# the content (and where it meets the tab bar), leaving it at raw image
# brightness while the interior got the full 0.45 - hence the bright frame
# around the edges. 1.0 (the actual default) applies the same tint there too.
background_tint_gaps    1.0

# Remote control is required by Pokemon-Terminal's kitty backend.
# socket-only rather than yes: a process needs $KITTY_LISTEN_ON to drive
# kitty, so stray escape sequences on the tty cannot.
allow_remote_control socket-only
listen_on            unix:@kitty-{kitty_pid}

# Desktop notification when a command finishes while the window isn't
# focused, but only if it ran at least 20s - short commands don't need one.
notify_on_cmd_finish unfocused 20

# Catppuccin Mocha. Dead while dark-theme.auto.conf exists (kitty picks that
# one for a dark desktop, and it overrides every line below including the
# background image ones) - kept here as the fallback for a light-mode
# desktop, where kitty would otherwise fall back to its own defaults.
cursor                #F5E0DC
selection_background  #585B70
selection_foreground  #1E1E2E
url_color             #F5E0DC
active_border_color   #B4BEFE
inactive_border_color #6C7086
background             #1E1E2E

color0  #45475A
color8  #585B70
color1  #F38BA8
color9  #F38BA8
color2  #A6E3A1
color10 #A6E3A1
color3  #F9E2AF
color11 #F9E2AF
color4  #89B4FA
color12 #89B4FA
color5  #F5C2E7
color13 #F5C2E7
color6  #94E2D5
color14 #94E2D5
color7  #BAC2DE
color15 #A6ADC8

tab_bar_background       #11111B
active_tab_background    #CBA6F7
active_tab_foreground    #11111B
inactive_tab_background  #181825
inactive_tab_foreground  #CDD6F4

# Keyboard resize: GNOME gives Wayland clients no real edge-grab area to
# resize by mouse, and its Super+click resize convention doesn't reach kitty
# either. This uses kitty's own resize-os-window instead, which asks the
# compositor directly - reliable regardless of what the WM's mouse handling
# supports. Plain ctrl+shift+arrow, NOT ctrl+alt+shift: that combo is GNOME's
# global "move window to workspace" binding.
map ctrl+shift+right remote_control resize-os-window --self --incremental --unit cells --width 10
map ctrl+shift+left  remote_control resize-os-window --self --incremental --unit cells --width -10
map ctrl+shift+up    remote_control resize-os-window --self --incremental --unit cells --height 5
map ctrl+shift+down  remote_control resize-os-window --self --incremental --unit cells --height -5
